      <circle cx="1.6" cy="1.6" r="1.05" fill="#B4AE95"/>
    </pattern>
    <filter id="grain-light" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="shadow-light" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#BD2632" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#BD2632" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clip-light"><rect x="0" y="0" width="1200" height="190" rx="26"/></clipPath>
