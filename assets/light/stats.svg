  <defs>
    <linearGradient id="bg-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#FCF7E8" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
