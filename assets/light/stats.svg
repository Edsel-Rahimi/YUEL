    <style>
      @keyframes fl-light {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.85; }
        80% { opacity: 0.45; }
        100% { transform: translateY(-330px); opacity: 0; }
      }
      .pt-light { animation: fl-light 9s linear infinite; }

      @keyframes sw-light {
        0%, 52% { transform: translateX(0) skewX(-20deg); }
        100% { transform: translateX(1900px) skewX(-20deg); }
      }
      .sweep-light { animation: sw-light 7.5s ease-in-out infinite; }

      @keyframes wvm-light { to { transform: translateX(-170px); } }
      .wv-light { animation: wvm-light 9s ease-in-out infinite alternate; }
      .wv2-light { animation-duration: 14s; }

      @keyframes sp-light { to { transform: rotate(360deg); } }
      .spin-light { transform-box: fill-box; transform-origin: center;
                  animation: sp-light 8s linear infinite; }
      .rev-light { animation-direction: reverse; }

      @keyframes bt-light { 50% { transform: scale(1.12); } }
      .beat-light { transform-box: fill-box; transform-origin: center;
                  animation: bt-light 2.4s ease-in-out infinite; }

      @keyframes gw-light { 50% { opacity: 0.55; } }
      .glowG-light { animation: gw-light 3.2s ease-in-out infinite; }

      @keyframes shn-light {
        0%, 46% { transform: translateX(-540px); }
        100% { transform: translateX(1620px); }
      }
      .shn-light { animation: shn-light 5.5s ease-in-out infinite; }

      @keyframes bgl-light { 0%, 100% { opacity: 0.35; } 12% { opacity: 1; } }
      .bgl-light { animation: bgl-light 2.2s ease-in-out infinite; }

      @keyframes dsh-light { to { stroke-dashoffset: -36; } }
      .dash-light { stroke-dasharray: 8 10; animation: dsh-light 1.2s linear infinite; }

      @keyframes pk-light {
        0% { transform: translateX(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(var(--d, 200px)); opacity: 0; }
      }
      .pk-light { animation: pk-light 2.6s linear infinite; }

      @keyframes pkv-light {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateY(var(--dy, 40px)); opacity: 0; }
      }
      .pkv-light { animation: pkv-light 2.6s linear infinite; }

      @keyframes pls-light {
        0% { transform: scale(0.55); opacity: 0.85; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      .pls-light { transform-box: fill-box; transform-origin: center;
                 animation: pls-light 2.4s ease-out infinite; }

      @keyframes flt-light { 50% { transform: translateY(-6px); } }
      .flt-light { animation: flt-light 6s ease-in-out infinite; }

      @keyframes grw-light { from { transform: scaleX(0); } }
      .grow-light { transform-box: fill-box; transform-origin: left center;
                  animation: grw-light 1.5s 0.2s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        .pt-light,.sweep-light,.wv-light,.spin-light,.rev-light,.beat-light,.glowG-light,.shn-light,.bgl-light,.dash-light,.pk-light,.pkv-light,.pls-light,.flt-light,.grow-light { animation: none; }
      }
    </style>
