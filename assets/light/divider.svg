<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img">
  <defs>
    <linearGradient id="bg-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#FCF7E8" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="tint-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E0C5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E8E0C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inner-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0.55"/>
      <stop offset="0.28" stop-color="#FAECC5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topbar-light" gradientUnits="userSpaceOnUse" x1="0" y1="1.5" x2="1200" y2="1.5">
      <stop offset="0" stop-color="#D03D00" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#BD2632" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4854A6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hero-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#D03D00" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#BD2632" stop-opacity="1"/>
      <stop offset="1" stop-color="#CC3C77" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="word-light" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D2327" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#BD2632" stop-opacity="1"/>
      <stop offset="1" stop-color="#D03D00" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ib-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#D03D00" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#D03D00" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D03D00" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#D1C9AC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D1C9AC" stop-opacity="0.49500000000000005"/>
    </linearGradient>
    <linearGradient id="div-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4AE95" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#B4AE95" stop-opacity="0.13999999999999999"/>
    </linearGradient>
    <radialGradient id="glow-light" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#D03D00" stop-opacity="0.55"/><stop offset="0.55" stop-color="#D03D00" stop-opacity="0.18"/><stop offset="1" stop-color="#D03D00" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1" y2="0">
      <stop offset="0" stop-color="#FC671F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FC671F" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FC671F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wavea-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#FC671F" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FC671F" stop-opacity="0.018"/>
    </linearGradient>
    <linearGradient id="waveb-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#4854A6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4854A6" stop-opacity="0.014000000000000002"/>
    </linearGradient>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.05" fill="#B4AE95"/>
    </pattern>
    <filter id="grain-light" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="shadow-light" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#BD2632" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#BD2632" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clip-light"><rect x="0" y="0" width="1200" height="64" rx="26"/></clipPath>
  </defs>
    <style>
      @keyframes fl-light {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.85; }
        80% { opacity: 0.45; }
        100% { transform: translateY(-330px); opacity: 0; }
      }
      .pt-light { animation: fl-light 9s linear infinite; }

      @keyframes sw-light {
        0%, 52% { transform: translateX(0) skewX(-20deg); }
        100% { transform: translateX(1900px) skewX(-20deg); }
      }
      .sweep-light { animation: sw-light 7.5s ease-in-out infinite; }

      @keyframes wvm-light { to { transform: translateX(-170px); } }
      .wv-light { animation: wvm-light 9s ease-in-out infinite alternate; }
      .wv2-light { animation-duration: 14s; }

      @keyframes sp-light { to { transform: rotate(360deg); } }
      .spin-light { transform-box: fill-box; transform-origin: center;
                  animation: sp-light 8s linear infinite; }
      .rev-light { animation-direction: reverse; }

      @keyframes bt-light { 50% { transform: scale(1.12); } }
      .beat-light { transform-box: fill-box; transform-origin: center;
                  animation: bt-light 2.4s ease-in-out infinite; }

      @keyframes gw-light { 50% { opacity: 0.55; } }
      .glowG-light { animation: gw-light 3.2s ease-in-out infinite; }

      @keyframes shn-light {
        0%, 46% { transform: translateX(-540px); }
        100% { transform: translateX(1620px); }
      }
      .shn-light { animation: shn-light 5.5s ease-in-out infinite; }

      @keyframes bgl-light { 0%, 100% { opacity: 0.35; } 12% { opacity: 1; } }
      .bgl-light { animation: bgl-light 2.2s ease-in-out infinite; }

      @keyframes dsh-light { to { stroke-dashoffset: -36; } }
      .dash-light { stroke-dasharray: 8 10; animation: dsh-light 1.2s linear infinite; }

      @keyframes pk-light {
        0% { transform: translateX(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(var(--d, 200px)); opacity: 0; }
      }
      .pk-light { animation: pk-light 2.6s linear infinite; }

      @keyframes pkv-light {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateY(var(--dy, 40px)); opacity: 0; }
      }
      .pkv-light { animation: pkv-light 2.6s linear infinite; }

      @keyframes pls-light {
        0% { transform: scale(0.55); opacity: 0.85; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      .pls-light { transform-box: fill-box; transform-origin: center;
                 animation: pls-light 2.4s ease-out infinite; }

      @keyframes flt-light { 50% { transform: translateY(-6px); } }
      .flt-light { animation: flt-light 6s ease-in-out infinite; }

      @keyframes grw-light { from { transform: scaleX(0); } }
      .grow-light { transform-box: fill-box; transform-origin: left center;
                  animation: grw-light 1.5s 0.2s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        .pt-light,.sweep-light,.wv-light,.spin-light,.rev-light,.beat-light,.glowG-light,.shn-light,.bgl-light,.dash-light,.pk-light,.pkv-light,.pls-light,.flt-light,.grow-light { animation: none; }
      }
    </style>
  <g filter="url(#shadow-light)"><rect width="1200" height="64" rx="16" fill="#FCF7E8"/></g>
  <rect width="1200" height="64" rx="16" fill="url(#bg-light)"/>
  <rect x="90" y="28" width="1020" height="8" rx="4" fill="url(#topbar-light)" opacity="0.9"/>
  <line class="dash-light" x1="90" y1="32" x2="1110" y2="32" stroke="#D03D00" stroke-opacity="0.55" stroke-width="2"/>
  <g class="pls-light" style="animation-delay:-0.0s"><circle cx="90" cy="32" r="6" fill="none" stroke="#D03D00" stroke-width="2" opacity="0.35"/></g>
  <circle class="bgl-light" cx="90.0" cy="32.0" r="4" fill="#D03D00"/>
  <g class="pls-light" style="animation-delay:-1.1s"><circle cx="1110" cy="32" r="6" fill="none" stroke="#D03D00" stroke-width="2" opacity="0.35"/></g>
  <circle class="bgl-light" cx="1110.0" cy="32.0" r="4" fill="#D03D00"/>
  <rect class="beat-light" x="595" y="27" width="10" height="10" rx="2" transform="rotate(45 600 32)" fill="#4854A6"/>
  <rect x="0.5" y="0.5" width="1199" height="63" rx="16" fill="none" stroke="url(#border-light)" stroke-width="1"/>
</svg>
