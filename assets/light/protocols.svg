<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
  <defs>
    <linearGradient id="bg-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="1"/>
      <stop offset="1" stop-color="#FAECC5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="tint-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#08442C" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#08442C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inner-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0.55"/>
      <stop offset="0.28" stop-color="#FAECC5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topbar-light" gradientUnits="userSpaceOnUse" x1="0" y1="1.5" x2="1200" y2="1.5">
