      <stop offset="0.55" stop-color="#BD2632" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F32138" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hero-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#BD2632" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#7D2327" stop-opacity="1"/>
      <stop offset="1" stop-color="#F32138" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="word-light" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D2327" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#BD2632" stop-opacity="1"/>
      <stop offset="1" stop-color="#F32138" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ib-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#BD2632" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#BD2632" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#BD2632" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#7D2327" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7D2327" stop-opacity="0.1925"/>
    </linearGradient>
    <linearGradient id="div-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1" y2="0">
      <stop offset="0" stop-color="#085834" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#085834" stop-opacity="0.0875"/>
    </linearGradient>
    <radialGradient id="glow-light" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F32138" stop-opacity="0.55"/><stop offset="0.55" stop-color="#F32138" stop-opacity="0.18"/><stop offset="1" stop-color="#F32138" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1" y2="0">
      <stop offset="0" stop-color="#F32138" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F32138" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F32138" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wavea-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#BD2632" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#BD2632" stop-opacity="0.018"/>
    </linearGradient>
    <linearGradient id="waveb-light" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#085834" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#085834" stop-opacity="0.014000000000000002"/>
    </linearGradient>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.05" fill="#085834"/>
    </pattern>
    <filter id="grain-light" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="shadow-light" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#BD2632" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#BD2632" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clip-light"><rect x="0" y="0" width="1200" height="300" rx="26"/></clipPath>
  </defs>
    <style>
      @keyframes fl-light {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.85; }
        80% { opacity: 0.45; }
        100% { transform: translateY(-330px); opacity: 0; }
      }
      .pt-light { animation: fl-light 9s linear infinite; }

      @keyframes sw-light {
        0%, 52% { transform: translateX(0) skewX(-20deg); }
        100% { transform: translateX(1900px) skewX(-20deg); }
      }
      .sweep-light { animation: sw-light 7.5s ease-in-out infinite; }

      @keyframes wvm-light { to { transform: translateX(-170px); } }
      .wv-light { animation: wvm-light 9s ease-in-out infinite alternate; }
      .wv2-light { animation-duration: 14s; }

      @keyframes sp-light { to { transform: rotate(360deg); } }
      .spin-light { transform-box: fill-box; transform-origin: center;
                  animation: sp-light 8s linear infinite; }
      .rev-light { animation-direction: reverse; }

      @keyframes bt-light { 50% { transform: scale(1.12); } }
      .beat-light { transform-box: fill-box; transform-origin: center;
                  animation: bt-light 2.4s ease-in-out infinite; }

      @keyframes gw-light { 50% { opacity: 0.55; } }
      .glowG-light { animation: gw-light 3.2s ease-in-out infinite; }

      @keyframes shn-light {
        0%, 46% { transform: translateX(-540px); }
        100% { transform: translateX(1620px); }
      }
      .shn-light { animation: shn-light 5.5s ease-in-out infinite; }

      @keyframes bgl-light { 0%, 100% { opacity: 0.35; } 12% { opacity: 1; } }
      .bgl-light { animation: bgl-light 2.2s ease-in-out infinite; }

      @keyframes dsh-light { to { stroke-dashoffset: -36; } }
      .dash-light { stroke-dasharray: 8 10; animation: dsh-light 1.2s linear infinite; }

      @keyframes pk-light {
        0% { transform: translateX(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(var(--d, 200px)); opacity: 0; }
      }
      .pk-light { animation: pk-light 2.6s linear infinite; }

      @keyframes pkv-light {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateY(var(--dy, 40px)); opacity: 0; }
      }
      .pkv-light { animation: pkv-light 2.6s linear infinite; }

      @keyframes pls-light {
        0% { transform: scale(0.55); opacity: 0.85; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      .pls-light { transform-box: fill-box; transform-origin: center;
                 animation: pls-light 2.4s ease-out infinite; }

      @keyframes flt-light { 50% { transform: translateY(-6px); } }
      .flt-light { animation: flt-light 6s ease-in-out infinite; }

      @keyframes grw-light { from { transform: scaleX(0); } }
      .grow-light { transform-box: fill-box; transform-origin: left center;
                  animation: grw-light 1.5s 0.2s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        .pt-light,.sweep-light,.wv-light,.spin-light,.rev-light,.beat-light,.glowG-light,.shn-light,.bgl-light,.dash-light,.pk-light,.pkv-light,.pls-light,.flt-light,.grow-light { animation: none; }
      }
    </style>
