<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" font-family="Space Grotesk, Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <style>.m-fade{animation:vf .7s ease-out both}.m-grow{transform-box:fill-box;transform-origin:left center;animation:vg .9s cubic-bezier(.2,.7,.2,1) both}.m-dash{animation:vm 26s linear infinite}.m-beat{animation:vb 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes vf{from{opacity:0}to{opacity:1}}@keyframes vg{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes vm{to{stroke-dashoffset:-320}}@keyframes vb{0%,86%,100%{transform:scale(1)}90%{transform:scale(1.05)}95%{transform:scale(1.01)}}@media (prefers-reduced-motion:reduce){.m-fade,.m-grow,.m-dash,.m-beat{animation:none}}</style>
  <linearGradient id="brand-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FC671F"/><stop offset="0.38" stop-color="#ED4A3B"/><stop offset="0.66" stop-color="#CC3C77"/><stop offset="1" stop-color="#6574C9"/></linearGradient>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="26" fill="#FCF7E8" stroke="#E8E0C5" stroke-width="1.5"/>

  <g class="m-fade" style="animation-delay:0.00s">
  <text x="48" y="50" font-size="10.5" font-weight="500" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2.4" fill="#545242">PIPELINE — SEVEN STAGES, ONE ENTRYPOINT</text>
