  <text x="74" y="320" font-size="24" font-weight="800" font-family="Space Grotesk, Inter, system-ui, -apple-system, Segoe UI, sans-serif" fill="#080806">p50 64.96</text>
  <text x="74" y="350" font-size="10.5" font-weight="500" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" fill="#545242">latency · success · freshness</text>
