<text x="74" y="162" font-size="24" font-weight="800" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" fill="#080806">24 sources</text>
<text x="74" y="192" font-size="10.5" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" fill="#545242">public lists, parsed per format</text>
</g>
<g class="r d3"><rect x="428" y="76" width="344" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.62" stroke="#D1C9AC" stroke-opacity="0.9" stroke-width="1.2"/>
