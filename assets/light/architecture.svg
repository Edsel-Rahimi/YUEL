  <text x="834" y="160" font-size="24" font-weight="800" font-family="Space Grotesk, Inter, system-ui, -apple-system, Segoe UI, sans-serif" fill="#080806">40,731 tested</text>
  <text x="834" y="190" font-size="10.5" font-weight="500" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" fill="#545242">real socks/http handshakes</text>
