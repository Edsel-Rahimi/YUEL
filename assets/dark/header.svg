<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif">
<style>
.r{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}
.d7{animation-delay:.56s}.d8{animation-delay:.64s}.d9{animation-delay:.74s}
.d10{animation-delay:.9s}.d11{animation-delay:1.05s}.d12{animation-delay:1.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.gw{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mh{animation:march 20s linear infinite}
@keyframes march{to{stroke-dashoffset:-400}}
.bt{transform-box:fill-box;transform-origin:center;animation:beat 2.8s ease-in-out infinite}
@keyframes beat{0%,84%,100%{transform:scale(1)}88%{transform:scale(1.05)}94%{transform:scale(1.01)}}
.pz{transform-box:fill-box;transform-origin:center;animation:ping 2.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.45);opacity:.85}75%,100%{transform:scale(2.5);opacity:0}}
.sp{animation:spin 12s linear infinite}
.sr{animation-duration:20s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sw{animation:sweep 7s cubic-bezier(.45,0,.25,1) infinite}
@keyframes sweep{0%,58%{transform:translateX(-660px) skewX(-16deg)}100%{transform:translateX(1380px) skewX(-16deg)}}
.dr{animation:drift 18s ease-in-out infinite alternate}
.da{animation-duration:26s;animation-delay:-9s}
.db{animation-duration:34s;animation-delay:-17s}
@keyframes drift{to{transform:translate(44px,-28px) scale(1.09)}}
.tk{animation:tw 3.4s ease-in-out infinite}
.ta{animation-delay:-1.1s}.tb{animation-delay:-2.3s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.5s ease-in-out infinite}
.ea{animation-delay:-.38s}.eb{animation-delay:-.76s}.ec{animation-delay:-1.14s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.cr{animation:caret 1.1s steps(2,jump-none) infinite}
@keyframes caret{50%{opacity:0}}
.dd{stroke-dasharray:100 100;animation:draw 1.15s cubic-bezier(.3,.6,.3,1) both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.gq{animation:glowq 3.2s ease-in-out infinite}
@keyframes glowq{0%,100%{opacity:.35}50%{opacity:1}}
.wv{animation:wv 13s linear infinite}
.wb{animation-duration:19s;animation-direction:reverse}
.wc{animation-duration:27s}
@keyframes wv{to{transform:translateX(-170px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FC671F"><animate attributeName="stop-color" values="#FC671F;#ED4A3B;#CC3C77;#6574C9;#FC671F" dur="9s" repeatCount="indefinite"/></stop><stop offset="0.38" stop-color="#ED4A3B"><animate attributeName="stop-color" values="#ED4A3B;#CC3C77;#6574C9;#FC671F;#ED4A3B" dur="9s" repeatCount="indefinite"/></stop><stop offset="0.66" stop-color="#CC3C77"><animate attributeName="stop-color" values="#CC3C77;#6574C9;#FC671F;#ED4A3B;#CC3C77" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#6574C9"><animate attributeName="stop-color" values="#6574C9;#FC671F;#ED4A3B;#CC3C77;#6574C9" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="bg2-dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FC671F"/><stop offset="0.38" stop-color="#ED4A3B"/><stop offset="0.66" stop-color="#CC3C77"/><stop offset="1" stop-color="#6574C9"/></linearGradient>
<filter id="ab-hdr" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="42"/></filter></defs>
<rect x="0.75" y="0.75" width="1198.5" height="478.5" rx="26" fill="#1E0D2F" stroke="#645676" stroke-width="1.5"/>

<g filter="url(#ab-hdr)"><ellipse class="dr" cx="240" cy="115" rx="312" ry="173" fill="#FC671F" fill-opacity="0.2"/><ellipse class="dr da" cx="984" cy="336" rx="360" ry="192" fill="#6574C9" fill-opacity="0.16"/><ellipse class="dr db" cx="660" cy="38" rx="264" ry="144" fill="#CC3C77" fill-opacity="0.13"/></g><g stroke="#645676" stroke-opacity="0.14"><line x1="60" y1="0" x2="60" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="180" y1="0" x2="180" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="300" y1="0" x2="300" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="420" y1="0" x2="420" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="540" y1="0" x2="540" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="660" y1="0" x2="660" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="780" y1="0" x2="780" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="900" y1="0" x2="900" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="1020" y1="0" x2="1020" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/><line x1="1140" y1="0" x2="1140" y2="480" class="mh" stroke-dasharray="2 14" stroke-width="1"/></g>
<g class="r d1"><image x="538" y="52" width="124" height="137.8" href="data:image/png;base64,"/></g>
<g class="r d3"><text x="600" y="266" font-size="10.5" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="2.4" text-anchor="middle" fill="#FC671F">PLAIN-PROXY INTELLIGENCE · REFRESHED EVERY 30 MINUTES</text></g>
<g class="r d5"><text x="600" y="330" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif"><tspan font-size="46" font-weight="800" fill="url(#bg-dark)" class="bt">2,160</tspan><tspan dx="10" font-size="26" font-weight="700" fill="#F7F6F9">alive</tspan><tspan dx="18" font-size="17" font-weight="500" fill="#CCC5D5" opacity="0.66">· 83 countries · 24 sources</tspan></text></g>
<rect x="480" y="354" width="240" height="3" rx="1.5" fill="url(#bg2-dark)" opacity="1.0" class="gw d7"/>
<g class="r d8"><text x="600" y="400" font-size="10.5" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="2.4" text-anchor="middle" fill="#CCC5D5">SOCKS4 · SOCKS5 · HTTP — ONE CLI · JSON + TXT OUTPUT · NO TUNNELS BY DESIGN</text><text x="600" y="448" font-size="11.5" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" fill="#CCC5D5">score p50 64.42 — every hop handshake-verified each run</text></g>
</svg>