    <style>
      @keyframes fl-dark {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.85; }
        80% { opacity: 0.45; }
        100% { transform: translateY(-330px); opacity: 0; }
      }
      .pt-dark { animation: fl-dark 9s linear infinite; }

      @keyframes sw-dark {
        0%, 52% { transform: translateX(0) skewX(-20deg); }
        100% { transform: translateX(1900px) skewX(-20deg); }
      }
      .sweep-dark { animation: sw-dark 7.5s ease-in-out infinite; }

      @keyframes wvm-dark { to { transform: translateX(-170px); } }
      .wv-dark { animation: wvm-dark 9s ease-in-out infinite alternate; }
      .wv2-dark { animation-duration: 14s; }

      @keyframes sp-dark { to { transform: rotate(360deg); } }
      .spin-dark { transform-box: fill-box; transform-origin: center;
                  animation: sp-dark 8s linear infinite; }
      .rev-dark { animation-direction: reverse; }

      @keyframes bt-dark { 50% { transform: scale(1.12); } }
      .beat-dark { transform-box: fill-box; transform-origin: center;
                  animation: bt-dark 2.4s ease-in-out infinite; }

      @keyframes gw-dark { 50% { opacity: 0.55; } }
      .glowG-dark { animation: gw-dark 3.2s ease-in-out infinite; }

      @keyframes shn-dark {
        0%, 46% { transform: translateX(-540px); }
        100% { transform: translateX(1620px); }
      }
      .shn-dark { animation: shn-dark 5.5s ease-in-out infinite; }

      @keyframes bgl-dark { 0%, 100% { opacity: 0.35; } 12% { opacity: 1; } }
      .bgl-dark { animation: bgl-dark 2.2s ease-in-out infinite; }

      @keyframes dsh-dark { to { stroke-dashoffset: -36; } }
      .dash-dark { stroke-dasharray: 8 10; animation: dsh-dark 1.2s linear infinite; }

      @keyframes pk-dark {
        0% { transform: translateX(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(var(--d, 200px)); opacity: 0; }
      }
      .pk-dark { animation: pk-dark 2.6s linear infinite; }

      @keyframes pkv-dark {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateY(var(--dy, 40px)); opacity: 0; }
      }
      .pkv-dark { animation: pkv-dark 2.6s linear infinite; }

      @keyframes pls-dark {
        0% { transform: scale(0.55); opacity: 0.85; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      .pls-dark { transform-box: fill-box; transform-origin: center;
                 animation: pls-dark 2.4s ease-out infinite; }

      @keyframes flt-dark { 50% { transform: translateY(-6px); } }
      .flt-dark { animation: flt-dark 6s ease-in-out infinite; }

      @keyframes grw-dark { from { transform: scaleX(0); } }
      .grow-dark { transform-box: fill-box; transform-origin: left center;
                  animation: grw-dark 1.5s 0.2s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        .pt-dark,.sweep-dark,.wv-dark,.spin-dark,.rev-dark,.beat-dark,.glowG-dark,.shn-dark,.bgl-dark,.dash-dark,.pk-dark,.pkv-dark,.pls-dark,.flt-dark,.grow-dark { animation: none; }
      }
    </style>
