      <circle cx="1.6" cy="1.6" r="1.05" fill="#CCC5D5"/>
    </pattern>
    <filter id="grain-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="shadow-dark" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#FC671F" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#FC671F" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clip-dark"><rect x="0" y="0" width="1200" height="290" rx="26"/></clipPath>
