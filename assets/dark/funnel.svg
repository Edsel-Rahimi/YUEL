      <stop offset="1" stop-color="#6574C9" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="word-dark" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FC671F" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#CC3C77" stop-opacity="1"/>
      <stop offset="1" stop-color="#6574C9" stop-opacity="1"/>
