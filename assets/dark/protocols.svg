  <defs>
    <linearGradient id="bg-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#08442C" stop-opacity="1"/>
      <stop offset="1" stop-color="#085834" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="tint-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
