    <linearGradient id="word-dark" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#F32138" stop-opacity="1"/>
      <stop offset="1" stop-color="#BD2632" stop-opacity="1"/>
