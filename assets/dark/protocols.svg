<g class="r d5"><circle cx="568" cy="144" r="6" fill="none" stroke="#6574C9" stroke-width="1.6" class="pz" style="animation-delay:0.0s"/><circle cx="568" cy="144" r="6" fill="#6574C9"/><text x="588" y="150" font-size="19" font-weight="700" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" letter-spacing="1.2" fill="#F7F6F9">HTTP</text><text x="588" y="174" font-size="11.5" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" fill="#CCC5D5">551 · 33.6%</text><line x1="560" y1="190" x2="1152" y2="190" stroke="#645676" stroke-opacity="0.31" stroke-width="1.2" stroke-linecap="round"/></g>
<g class="r d6"><circle cx="568" cy="200" r="6" fill="none" stroke="#FC671F" stroke-width="1.6" class="pz" style="animation-delay:0.3s"/><circle cx="568" cy="200" r="6" fill="#FC671F"/><text x="588" y="206" font-size="19" font-weight="700" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" letter-spacing="1.2" fill="#F7F6F9">SOCKS5</text><text x="588" y="230" font-size="11.5" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" fill="#CCC5D5">963 · 58.8%</text><line x1="560" y1="246" x2="1152" y2="246" stroke="#645676" stroke-opacity="0.31" stroke-width="1.2" stroke-linecap="round"/></g>
<g class="r d7"><circle cx="568" cy="256" r="6" fill="none" stroke="#ED4A3B" stroke-width="1.6" class="pz" style="animation-delay:0.6s"/><circle cx="568" cy="256" r="6" fill="#ED4A3B"/><text x="588" y="262" font-size="19" font-weight="700" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" letter-spacing="1.2" fill="#F7F6F9">SOCKS4</text><text x="588" y="286" font-size="11.5" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" fill="#CCC5D5">125 · 7.6%</text><line x1="560" y1="302" x2="1152" y2="302" stroke="#645676" stroke-opacity="0.31" stroke-width="1.2" stroke-linecap="round"/></g>
</svg>