    <linearGradient id="ib-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#F32138" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#F32138" stop-opacity="0.16"/>
