<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img">
  <defs>
    <linearGradient id="bg-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#08442C" stop-opacity="1"/>
      <stop offset="1" stop-color="#085834" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="tint-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FAECC5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inner-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0.1"/>
      <stop offset="0.28" stop-color="#FAECC5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topbar-dark" gradientUnits="userSpaceOnUse" x1="0" y1="1.5" x2="1200" y2="1.5">
      <stop offset="0" stop-color="#085834" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#BD2632" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F32138" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hero-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#F32138" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#BD2632" stop-opacity="1"/>
      <stop offset="1" stop-color="#FAECC5" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="word-dark" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#F32138" stop-opacity="1"/>
      <stop offset="1" stop-color="#BD2632" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ib-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#F32138" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#F32138" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F32138" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FAECC5" stop-opacity="0.11000000000000001"/>
    </linearGradient>
    <linearGradient id="div-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FAECC5" stop-opacity="0.055999999999999994"/>
    </linearGradient>
    <radialGradient id="glow-dark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F32138" stop-opacity="0.55"/><stop offset="0.55" stop-color="#F32138" stop-opacity="0.18"/><stop offset="1" stop-color="#F32138" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FAECC5" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FAECC5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wavea-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#F32138" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#F32138" stop-opacity="0.020000000000000004"/>
    </linearGradient>
    <linearGradient id="waveb-dark" gradientUnits="objectBoundingBox" x1="0.0" y1="0.0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAECC5" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FAECC5" stop-opacity="0.014000000000000002"/>
    </linearGradient>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.05" fill="#FAECC5"/>
    </pattern>
    <filter id="grain-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="shadow-dark" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#F32138" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#F32138" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clip-dark"><rect x="0" y="0" width="1200" height="64" rx="26"/></clipPath>
  </defs>
    <style>
      @keyframes fl-dark {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.85; }
        80% { opacity: 0.45; }
        100% { transform: translateY(-330px); opacity: 0; }
      }
      .pt-dark { animation: fl-dark 9s linear infinite; }

      @keyframes sw-dark {
        0%, 52% { transform: translateX(0) skewX(-20deg); }
        100% { transform: translateX(1900px) skewX(-20deg); }
      }
      .sweep-dark { animation: sw-dark 7.5s ease-in-out infinite; }

      @keyframes wvm-dark { to { transform: translateX(-170px); } }
      .wv-dark { animation: wvm-dark 9s ease-in-out infinite alternate; }
      .wv2-dark { animation-duration: 14s; }

      @keyframes sp-dark { to { transform: rotate(360deg); } }
      .spin-dark { transform-box: fill-box; transform-origin: center;
                  animation: sp-dark 8s linear infinite; }
      .rev-dark { animation-direction: reverse; }

      @keyframes bt-dark { 50% { transform: scale(1.12); } }
      .beat-dark { transform-box: fill-box; transform-origin: center;
                  animation: bt-dark 2.4s ease-in-out infinite; }

      @keyframes gw-dark { 50% { opacity: 0.55; } }
      .glowG-dark { animation: gw-dark 3.2s ease-in-out infinite; }

      @keyframes shn-dark {
        0%, 46% { transform: translateX(-540px); }
        100% { transform: translateX(1620px); }
      }
      .shn-dark { animation: shn-dark 5.5s ease-in-out infinite; }

      @keyframes bgl-dark { 0%, 100% { opacity: 0.35; } 12% { opacity: 1; } }
      .bgl-dark { animation: bgl-dark 2.2s ease-in-out infinite; }

      @keyframes dsh-dark { to { stroke-dashoffset: -36; } }
      .dash-dark { stroke-dasharray: 8 10; animation: dsh-dark 1.2s linear infinite; }

      @keyframes pk-dark {
        0% { transform: translateX(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(var(--d, 200px)); opacity: 0; }
      }
      .pk-dark { animation: pk-dark 2.6s linear infinite; }

      @keyframes pkv-dark {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateY(var(--dy, 40px)); opacity: 0; }
      }
      .pkv-dark { animation: pkv-dark 2.6s linear infinite; }

      @keyframes pls-dark {
        0% { transform: scale(0.55); opacity: 0.85; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      .pls-dark { transform-box: fill-box; transform-origin: center;
                 animation: pls-dark 2.4s ease-out infinite; }

      @keyframes flt-dark { 50% { transform: translateY(-6px); } }
      .flt-dark { animation: flt-dark 6s ease-in-out infinite; }

      @keyframes grw-dark { from { transform: scaleX(0); } }
      .grow-dark { transform-box: fill-box; transform-origin: left center;
                  animation: grw-dark 1.5s 0.2s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        .pt-dark,.sweep-dark,.wv-dark,.spin-dark,.rev-dark,.beat-dark,.glowG-dark,.shn-dark,.bgl-dark,.dash-dark,.pk-dark,.pkv-dark,.pls-dark,.flt-dark,.grow-dark { animation: none; }
      }
    </style>
  <g filter="url(#shadow-dark)"><rect width="1200" height="64" rx="16" fill="#08442C"/></g>
  <rect width="1200" height="64" rx="16" fill="url(#bg-dark)"/>
  <rect x="90" y="28" width="1020" height="8" rx="4" fill="url(#topbar-dark)" opacity="0.9"/>
  <line class="dash-dark" x1="90" y1="32" x2="1110" y2="32" stroke="#F32138" stroke-opacity="0.55" stroke-width="2"/>
  <g class="pls-dark" style="animation-delay:-0.0s"><circle cx="90" cy="32" r="6" fill="none" stroke="#F32138" stroke-width="2" opacity="0.35"/></g>
  <circle class="bgl-dark" cx="90.0" cy="32.0" r="4" fill="#F32138"/>
  <g class="pls-dark" style="animation-delay:-1.1s"><circle cx="1110" cy="32" r="6" fill="none" stroke="#F32138" stroke-width="2" opacity="0.35"/></g>
  <circle class="bgl-dark" cx="1110.0" cy="32.0" r="4" fill="#F32138"/>
  <rect class="beat-dark" x="595" y="27" width="10" height="10" rx="2" transform="rotate(45 600 32)" fill="#FAECC5"/>
  <rect x="0.5" y="0.5" width="1199" height="63" rx="16" fill="none" stroke="url(#border-dark)" stroke-width="1"/>
</svg>
