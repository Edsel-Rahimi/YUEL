<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="YUEL pipeline — seven stages">
<style>
.pt{animation:pt 8s linear infinite}
@keyframes pt{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-300px);opacity:0}}
.orb{transform-box:fill-box;transform-origin:center;animation:orb 9s linear infinite}
.o2{animation-duration:14s;animation-direction:reverse}
.o3{animation-duration:22s}
@keyframes orb{to{transform:rotate(360deg)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 4.2s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.85}}
.sweep{animation:sw 6.5s ease-in-out infinite}
@keyframes sw{0%,58%{transform:translateX(-640px) skewX(-18deg)}100%{transform:translateX(1300px) skewX(-18deg)}}
.scan{animation:sc 7s cubic-bezier(.4,0,.6,1) infinite}
@keyframes sc{0%{transform:translateY(-10px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(300px);opacity:0}}
.wv{animation:wv 11s ease-in-out infinite alternate}
.w2{animation-duration:16s}.w3{animation-duration:23s}
@keyframes wv{to{transform:translateX(-150px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 7s linear infinite}
.rev{animation-direction:reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.beat{transform-box:fill-box;transform-origin:center;animation:bt 2.4s ease-in-out infinite}
@keyframes bt{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(.97)}36%{transform:scale(1)}}
.glow{animation:gw 3.2s ease-in-out infinite}
@keyframes gw{50%{opacity:.35}}
.dash{stroke-dasharray:7 9;animation:dsh 1.4s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-32}}
.pk{animation:pk 3.2s linear infinite}
.p2{animation-delay:1.1s}.p3{animation-delay:2.2s}
@keyframes pk{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--d,880px));opacity:0}}
.pls{transform-box:fill-box;transform-origin:center;animation:pls 2.6s ease-out infinite}
@keyframes pls{0%{transform:scale(.6);opacity:.85}100%{transform:scale(2.6);opacity:0}}
.flt{animation:flt 5.5s ease-in-out infinite}
.f2{animation-delay:-2.7s}
@keyframes flt{50%{transform:translateY(-9px)}}
.rise{animation:rs .9s cubic-bezier(.2,.7,.2,1) both}
.r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}.r5{animation-delay:.6s}.r6{animation-delay:.75s}.r7{animation-delay:.9s}.r8{animation-delay:1.05s}
@keyframes rs{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.grid{animation:gd 3.4s linear infinite}
@keyframes gd{to{stroke-dashoffset:-44}}
.hue{animation:hue 9s linear infinite}
@keyframes hue{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(18deg)}}
.skew{animation:skw 12s ease-in-out infinite alternate}
@keyframes skw{from{transform:translateX(0)}to{transform:translateX(-360px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#e35a17">
    <animate attributeName="stop-color" values="#e35a17;#d98a10;#7c3aed;#e35a17" dur="9s" repeatCount="indefinite"/>
  </stop>
  <stop offset=".55" stop-color="#d98a10">
    <animate attributeName="stop-color" values="#d98a10;#7c3aed;#e35a17;#d98a10" dur="9s" repeatCount="indefinite"/>
  </stop>
  <stop offset="1" stop-color="#7c3aed">
    <animate attributeName="stop-color" values="#7c3aed;#e35a17;#d98a10;#7c3aed" dur="9s" repeatCount="indefinite"/>
  </stop>
</linearGradient>
<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#e35a17" stop-opacity="0"/>
  <stop offset=".3" stop-color="#e35a17"/><stop offset=".55" stop-color="#d98a10"/>
  <stop offset=".8" stop-color="#7c3aed"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</linearGradient>
<linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f6f1e9"/><stop offset=".6" stop-color="#efe7da"/><stop offset="1" stop-color="#f6f1e9"/>
</linearGradient>
<linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e35a17" stop-opacity="0"/>
  <stop offset=".5" stop-color="#e35a17" stop-opacity=".55"/>
  <stop offset="1" stop-color="#e35a17" stop-opacity="0"/>
</linearGradient>
<radialGradient id="gOrL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 40) scale(620 360)">
  <stop offset="0" stop-color="#e35a17" stop-opacity=".5"><animate attributeName="stop-opacity" values=".5;.9;.5" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#e35a17" stop-opacity="0"/>
</radialGradient>
<radialGradient id="gOrR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1140 40) scale(620 360)">
  <stop offset="0" stop-color="#7c3aed" stop-opacity=".5"><animate attributeName="stop-opacity" values=".5;.9;.5" dur="7.5s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</radialGradient>
<filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="fSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="300" fill="url(#gBg)"/>
<g class="glow"><rect x="0" y="126" width="1200" height="4" fill="#e35a17" opacity=".12" filter="url(#fSoft)"/></g>
<line x1="212" y1="128" x2="238" y2="128" stroke="rgba(43,37,55,0.35)" stroke-width="1.6" class="dash"/><line x1="362" y1="128" x2="388" y2="128" stroke="rgba(43,37,55,0.35)" stroke-width="1.6" class="dash"/><line x1="512" y1="128" x2="538" y2="128" stroke="rgba(43,37,55,0.35)" stroke-width="1.6" class="dash"/><line x1="662" y1="128" x2="688" y2="128" stroke="rgba(43,37,55,0.35)" stroke-width="1.6" class="dash"/><line x1="812" y1="128" x2="838" y2="128" stroke="rgba(43,37,55,0.35)" stroke-width="1.6" class="dash"/><line x1="962" y1="128" x2="988" y2="128" stroke="rgba(43,37,55,0.35)" stroke-width="1.6" class="dash"/>
<g class="rise r1">
  <rect x="88" y="84" width="124" height="88" rx="16" fill="#fffdf8" stroke="rgba(43,37,55,0.18)"/>
  <circle cx="150" cy="84" r="17" fill="#efe7da" stroke="rgba(43,37,55,0.18)"/>
  <text x="150" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#2b2537">1</text>
  <text x="150" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2b2537">collect</text>
  <text x="150" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f687f">fetch + parse</text>
  
</g><g class="rise r2">
  <rect x="238" y="84" width="124" height="88" rx="16" fill="#fffdf8" stroke="rgba(43,37,55,0.18)"/>
  <circle cx="300" cy="84" r="17" fill="#efe7da" stroke="rgba(43,37,55,0.18)"/>
  <text x="300" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#2b2537">2</text>
  <text x="300" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2b2537">normalize</text>
  <text x="300" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f687f">identity dedupe</text>
  
</g><g class="rise r3">
  <rect x="388" y="84" width="124" height="88" rx="16" fill="#fffdf8" stroke="rgba(43,37,55,0.18)"/>
  <circle cx="450" cy="84" r="17" fill="#efe7da" stroke="rgba(43,37,55,0.18)"/>
  <text x="450" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#2b2537">3</text>
  <text x="450" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2b2537">validate</text>
  <text x="450" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f687f">real handshakes</text>
  
</g><g class="rise r4">
  <rect x="538" y="84" width="124" height="88" rx="16" fill="#fffdf8" stroke="rgba(43,37,55,0.18)"/>
  <circle cx="600" cy="84" r="17" fill="#efe7da" stroke="rgba(43,37,55,0.18)"/>
  <text x="600" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#2b2537">4</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2b2537">score</text>
  <text x="600" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f687f">weighted tiers</text>
  
</g><g class="rise r5">
  <rect x="688" y="84" width="124" height="88" rx="16" fill="#fffdf8" stroke="rgba(43,37,55,0.18)"/>
  <circle cx="750" cy="84" r="17" fill="#efe7da" stroke="rgba(43,37,55,0.18)"/>
  <text x="750" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#2b2537">5</text>
  <text x="750" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2b2537">geo</text>
  <text x="750" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f687f">IP → country</text>
  
</g><g class="rise r6">
  <rect x="838" y="84" width="124" height="88" rx="16" fill="#fffdf8" stroke="rgba(43,37,55,0.18)"/>
  <circle cx="900" cy="84" r="17" fill="#efe7da" stroke="rgba(43,37,55,0.18)"/>
  <text x="900" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#2b2537">6</text>
  <text x="900" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2b2537">publish</text>
  <text x="900" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f687f">data/out/</text>
  
</g><g class="rise r7">
  <rect x="988" y="84" width="124" height="88" rx="16" fill="#fffdf8" stroke="#e35a17"/>
  <circle cx="1050" cy="84" r="17" fill="#efe7da" stroke="#e35a17"/>
  <text x="1050" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#e35a17">7</text>
  <text x="1050" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2b2537">automate</text>
  <text x="1050" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#6f687f">CI every 30m</text>
  <g class="spin" style="animation-duration:3.4s"><circle cx="1050" cy="84" r="11" fill="none" stroke="#e35a17" stroke-width="2.4" stroke-dasharray="14 22"/></g>
</g>
<g class="pk p1" style="--d:300px"><circle cx="212" cy="128" r="4.5" fill="#d98a10" filter="url(#fGlow)"/></g><g class="pk p2" style="--d:300px"><circle cx="362" cy="128" r="4.5" fill="#d98a10" filter="url(#fGlow)"/></g><g class="pk p3" style="--d:300px"><circle cx="512" cy="128" r="4.5" fill="#d98a10" filter="url(#fGlow)"/></g><g class="pk p1" style="--d:300px"><circle cx="662" cy="128" r="4.5" fill="#d98a10" filter="url(#fGlow)"/></g><g class="pk p2" style="--d:300px"><circle cx="812" cy="128" r="4.5" fill="#d98a10" filter="url(#fGlow)"/></g><g class="pk p3" style="--d:300px"><circle cx="962" cy="128" r="4.5" fill="#d98a10" filter="url(#fGlow)"/></g>
<text x="600" y="248" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#6f687f">collect → normalize → validate → score → geo → publish → automate · <tspan fill="#e35a17">every stage verified against live data</tspan><tspan class="blink"> ▌</tspan></text>
</svg>