<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="YUEL pipeline — seven stages">
<style>
.pt{animation:pt 8s linear infinite}
@keyframes pt{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
.sweep{animation:sw 6.5s ease-in-out infinite}
@keyframes sw{0%,55%{transform:translateX(-620px) skewX(-18deg)}100%{transform:translateX(1240px) skewX(-18deg)}}
.wv{animation:wv 11s ease-in-out infinite alternate}
.w2{animation-duration:16s}
@keyframes wv{to{transform:translateX(-120px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 7s linear infinite}
.rev{animation-direction:reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.beat{transform-box:fill-box;transform-origin:center;animation:bt 2.4s ease-in-out infinite}
@keyframes bt{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(.98)}36%{transform:scale(1)}}
.glow{animation:gw 3.2s ease-in-out infinite}
@keyframes gw{50%{opacity:.4}}
.dash{stroke-dasharray:7 9;animation:dsh 1.4s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-32}}
.pk{animation:pk 3.2s linear infinite}
.p2{animation-delay:1.1s}.p3{animation-delay:2.2s}
@keyframes pk{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--d,880px));opacity:0}}
.pls{transform-box:fill-box;transform-origin:center;animation:pls 2.6s ease-out infinite}
@keyframes pls{0%{transform:scale(.6);opacity:.85}100%{transform:scale(2.4);opacity:0}}
.flt{animation:flt 5.5s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-6px)}}
.rise{animation:rs .9s cubic-bezier(.2,.7,.2,1) both}
.r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}.r5{animation-delay:.6s}.r6{animation-delay:.75s}.r7{animation-delay:.9s}.r8{animation-delay:1.05s}
@keyframes rs{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#f4732c"/><stop offset=".55" stop-color="#f4a12c"/><stop offset="1" stop-color="#8b5cf6"/>
</linearGradient>
<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#f4732c" stop-opacity="0"/>
  <stop offset=".3" stop-color="#f4732c"/><stop offset=".55" stop-color="#f4a12c"/>
  <stop offset=".8" stop-color="#8b5cf6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
</linearGradient>
<linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1f1b2b"/><stop offset=".6" stop-color="#2e2a3b"/><stop offset="1" stop-color="#1f1b2b"/>
</linearGradient>
<linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="gOrL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 40) scale(560 320)">
  <stop offset="0" stop-color="#f4732c" stop-opacity=".5"/><stop offset="1" stop-color="#f4732c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="gOrR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1140 40) scale(560 320)">
  <stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
</radialGradient>
<filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1200" height="300" fill="url(#gBg)"/>
<line x1="212" y1="128" x2="238" y2="128" stroke="rgba(244,239,233,0.30)" stroke-width="1.6" class="dash"/><line x1="362" y1="128" x2="388" y2="128" stroke="rgba(244,239,233,0.30)" stroke-width="1.6" class="dash"/><line x1="512" y1="128" x2="538" y2="128" stroke="rgba(244,239,233,0.30)" stroke-width="1.6" class="dash"/><line x1="662" y1="128" x2="688" y2="128" stroke="rgba(244,239,233,0.30)" stroke-width="1.6" class="dash"/><line x1="812" y1="128" x2="838" y2="128" stroke="rgba(244,239,233,0.30)" stroke-width="1.6" class="dash"/><line x1="962" y1="128" x2="988" y2="128" stroke="rgba(244,239,233,0.30)" stroke-width="1.6" class="dash"/>
<g class="rise r1">
  <rect x="88" y="84" width="124" height="88" rx="16" fill="#262233" stroke="rgba(244,239,233,0.18)"/>
  <circle cx="150" cy="84" r="17" fill="#2e2a3b" stroke="rgba(244,239,233,0.18)"/>
  <text x="150" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#f4efe9">1</text>
  <text x="150" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#f4efe9">collect</text>
  <text x="150" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#a49fb5">fetch + parse</text>
</g><g class="rise r2">
  <rect x="238" y="84" width="124" height="88" rx="16" fill="#262233" stroke="rgba(244,239,233,0.18)"/>
  <circle cx="300" cy="84" r="17" fill="#2e2a3b" stroke="rgba(244,239,233,0.18)"/>
  <text x="300" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#f4efe9">2</text>
  <text x="300" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#f4efe9">normalize</text>
  <text x="300" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#a49fb5">identity dedupe</text>
</g><g class="rise r3">
  <rect x="388" y="84" width="124" height="88" rx="16" fill="#262233" stroke="rgba(244,239,233,0.18)"/>
  <circle cx="450" cy="84" r="17" fill="#2e2a3b" stroke="rgba(244,239,233,0.18)"/>
  <text x="450" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#f4efe9">3</text>
  <text x="450" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#f4efe9">validate</text>
  <text x="450" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#a49fb5">real handshakes</text>
</g><g class="rise r4">
  <rect x="538" y="84" width="124" height="88" rx="16" fill="#262233" stroke="rgba(244,239,233,0.18)"/>
  <circle cx="600" cy="84" r="17" fill="#2e2a3b" stroke="rgba(244,239,233,0.18)"/>
  <text x="600" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#f4efe9">4</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#f4efe9">score</text>
  <text x="600" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#a49fb5">weighted tiers</text>
</g><g class="rise r5">
  <rect x="688" y="84" width="124" height="88" rx="16" fill="#262233" stroke="rgba(244,239,233,0.18)"/>
  <circle cx="750" cy="84" r="17" fill="#2e2a3b" stroke="rgba(244,239,233,0.18)"/>
  <text x="750" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#f4efe9">5</text>
  <text x="750" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#f4efe9">geo</text>
  <text x="750" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#a49fb5">IP → country</text>
</g><g class="rise r6">
  <rect x="838" y="84" width="124" height="88" rx="16" fill="#262233" stroke="rgba(244,239,233,0.18)"/>
  <circle cx="900" cy="84" r="17" fill="#2e2a3b" stroke="rgba(244,239,233,0.18)"/>
  <text x="900" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#f4efe9">6</text>
  <text x="900" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#f4efe9">publish</text>
  <text x="900" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#a49fb5">data/out/</text>
</g><g class="rise r7">
  <rect x="988" y="84" width="124" height="88" rx="16" fill="#262233" stroke="#f4732c"/>
  <circle cx="1050" cy="84" r="17" fill="#2e2a3b" stroke="#f4732c"/>
  <text x="1050" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#f4732c">7</text>
  <text x="1050" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#f4efe9">automate</text>
  <text x="1050" y="155" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#a49fb5">CI every 30m</text>
</g>
<g class="pk p1" style="--d:300px"><circle cx="212" cy="128" r="4.5" fill="#f4a12c"/></g><g class="pk p2" style="--d:300px"><circle cx="362" cy="128" r="4.5" fill="#f4a12c"/></g><g class="pk p3" style="--d:300px"><circle cx="512" cy="128" r="4.5" fill="#f4a12c"/></g><g class="pk p1" style="--d:300px"><circle cx="662" cy="128" r="4.5" fill="#f4a12c"/></g><g class="pk p2" style="--d:300px"><circle cx="812" cy="128" r="4.5" fill="#f4a12c"/></g><g class="pk p3" style="--d:300px"><circle cx="962" cy="128" r="4.5" fill="#f4a12c"/></g>
<text x="600" y="248" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#a49fb5">collect → normalize → validate → score → geo → publish → automate · <tspan fill="#f4732c">every stage verified against live data</tspan><tspan class="blink"> ▌</tspan></text>
</svg>